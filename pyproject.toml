[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-netflix-recsys"
version = "0.1.0"
description = "Mini-Netflix Recommender with Two-Tower Retrieval, LightGBM Ranking, and Real-Time Inference"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "torch>=2.1",
    "lightgbm>=4.1",
    "faiss-cpu>=1.7",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "redis>=5.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "prometheus-client>=0.19",
    "structlog>=23.2",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.7",
]
demo = [
    "streamlit>=1.29",
]
loadtest = [
    "locust>=2.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
